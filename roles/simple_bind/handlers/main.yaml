# vim: sw=2:sts=2
---
- name: _tina_validate_bind_conf
  ansible.builtin.command:
    cmd: named-checkconf
    chdir: '{{ _sbind_confdir }}'
  changed_when: false

- name: _tina_reload_bind
  ansible.builtin.service:
    name: '{{ _sbind_svcname }}'
    state: reloaded

- name: _tina_reload_ferm
  ansible.builtin.service:
    name: ferm
    state: reloaded
