# vim:ts=2:sw=2:et:ai:sts=2
---
# This task file is executed in a loop over users__create_users.

- name: '[{{ user.name }}] create user'
  ansible.builtin.user:
    state: present
    system: '{{ user.system }}'
    name: '{{ user.name }}'
    comment: '{{ user.gecos }}'
    password: '{{ user.password }}'
    groups: '{{
      user.groups if user.groups is string else ",".join(user.groups) }}'
    append: '{{ user.append }}'
    home: '{{ user.home }}'
    create_home: '{{ user.create_home }}'
    move_home: '{{ user.move_home }}'
    shell: '{{ user.shell }}'
    generate_ssh_key: '{{ user.generate_ssh_key }}'
    update_password: '{{ user.update_password }}'

- name: '[{{ user.name }}] set mail forwarding'
  ansible.builtin.lineinfile:
    dest: /etc/aliases
    line: '{{ user.name }}: {{ user.forward }}'
    regexp: '^{{ user.name }}:.*'
    state: '{{ "present" if user.forward else "absent" }}'
  notify: _tina_run_newaliases
  when: >
    users__manage_aliases

- name: '[{{ user.name }}] set SSH authorized keys'
  ansible.posix.authorized_key:
    user: '{{ user.name }}'
    # Important: double quotes scalar is needed here so that '\n'.join() uses
    # actual newlines, and not literal r'\n'.
    # yamllint disable-line rule:quoted-strings
    key: "{{
      user.authorized
      if user.authorized is string else
      '\n'.join(user.authorized)
      }}"
    exclusive: true

- name: '[{{ user.name }}] set-up user home: find files'
  # Scan users__home_dir_templates only once and segment results to avoid
  # unnecessary loop interations later.
  ansible.builtin.set_fact:
    _usr_home_dirs: |-
      {{ _usr_home_allfiles_by_state.get('directory') or [] }}
    _usr_home_files: |-
      {{
        (_usr_home_allfiles_by_state.get('file') or []) |
        rejectattr('path', 'ansible.builtin.search', '.*\.j2$')
      }}
    _usr_home_templates: |-
      {{
        (_usr_home_allfiles_by_state.get('file') or []) |
        selectattr('path', 'ansible.builtin.search', '.*\.j2$')
      }}
    _usr_home_links: |-
      {{ _usr_home_allfiles_by_state.get('link') or [] }}
  vars:
    _usr_home_srcdir: |-
      {{ (users__home_dir_templates, user.name) | ansible.builtin.path_join }}
    _usr_home_allfiles_by_state: |-
      {{
        query('community.general.filetree', _usr_home_srcdir) |
        groupby('state') | community.general.dict
      }}

- name: '[{{ user.name }}] set-up user home: directories'
  ansible.builtin.file:
    path: '{{ (user.home, item.path) | ansible.builtin.path_join }}'
    mode: '{{ _usr_home_dmode }}'
    owner: '{{ user.name }}'
    group: '{{ user.name }}'
    state: directory
  loop: '{{ _usr_home_dirs }}'
  loop_control:
    label: '{{ (user.home, item.path) | ansible.builtin.path_join }}'

- name: '[{{ user.name }}] set-up user home: normal files'
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ user.home }}/{{ item.path }}'
    # Force mode if requested; then add *all* executable bits if *any* is set
    # in the source, and requested.
    mode: '{{ _usr_home_fmode }}'
    owner: '{{ user.name }}'
    group: '{{ user.name }}'
  loop: '{{ _usr_home_files }}'
  loop_control:
    label: '{{ (user.home, item.path) | ansible.builtin.path_join }}'

- name: '[{{ user.name }}] set-up user home: templates'
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ user.home }}/{{ item.path | regex_replace("\.j2$", "") }}'
    # Force mode if requested; then add *all* executable bits if *any* is set
    # in the source, and requested.
    mode: '{{ _usr_home_fmode }}'
    owner: '{{ user.name }}'
    group: '{{ user.name }}'
  loop: '{{ _usr_home_templates }}'
  loop_control:
    label: '{{ (user.home, item.path) | ansible.builtin.path_join }}'

- name: '[{{ user.name }}] set-up user home: symlinks'
  ansible.builtin.file:
    src: '{{ item.src }}'
    path: '{{ user.home }}/{{ item.path }}'
    # Always use default mode.
    owner: '{{ user.name }}'
    group: '{{ user.name }}'
    state: link
    force: true
    follow: false
  loop: '{{ _usr_home_links }}'
  loop_control:
    label: '{{ (user.home, item.path) | ansible.builtin.path_join }}'
