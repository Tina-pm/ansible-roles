# vim:ts=2:sw=2:et:ai:sts=2
---

# Group that grants sudo privileges, by OS family.
_base_setup__sudo_group_by_os_family:
  Debian: sudo
  RedHat: wheel

_base_setup__pkg_install: |-
  {{
    (['sudo'] if base_setup__setup_sudo | bool else []) +
    (['postfix'] if base_setup__setup_postfix | bool else []) +
    (['locales'] if base_setup__setup_locales | bool else []) +
    (base_setup__pkg_install or [])
  }}

_base_setup__svc_enable_start: |-
  {{
    (['postfix'] if base_setup__setup_postfix | bool else []) +
    (base_setup__svc_enable_start or [])
  }}
