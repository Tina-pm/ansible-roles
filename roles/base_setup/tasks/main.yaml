# vim:ts=2:sw=2:et:ai:sts=2
---
- name: Check cloud-init presence
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg
  register: _cloud_init_cfg
  when: base_setup__disable_cloud_init | bool
  check_mode: false

- name: Disable cloud-init
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: '0644'
  when: base_setup__disable_cloud_init | bool and _cloud_init_cfg.stat.exists

- name: Disable systemd-resolved (removing libnss-resolve)
  ansible.builtin.package:
    name: libnss-resolve
    state: absent
  when: base_setup__disable_resolved | bool

- name: Set hostname and FQDN
  ansible.builtin.include_role:
    name: hostname
  vars:
    hostname__fqdn: '{{ base_setup__set_hostname }}'
  when: base_setup__set_hostname is ansible.builtin.truthy

- name: Setup APT, upgrade installed packages, and install base packages
  ansible.builtin.include_role:
    name: apt
  vars:
    apt__run_upgrade: true
    apt__run_autoremove: true
    apt__purge_removed: true
    apt__packages_to_install: '{{ base_setup__pkg_install }}'
    apt__services_to_enable: '{{ base_setup__svc_enable_start }}'
    apt__services_to_start: '{{ base_setup__svc_enable_start }}'

- name: Install postfix
  ansible.builtin.package:
    name: postfix
    state: present
  when: base_setup__setup_postfix

- name: Set mail relay
  ansible.builtin.lineinfile:
    dest: /etc/postfix/main.cf
    line: relayhost = {{ base_setup__mail_relay }}
    regexp: '^relayhost\s*='
    insertafter: '^\s*#relayhost'
    state: present
  when:
    base_setup__mail_relay is ansible.builtin.truthy and
    base_setup__setup_postfix | bool
  notify: _tina_reload_postfix

- name: Set hostname for postfix
  ansible.builtin.lineinfile:
    dest: /etc/postfix/main.cf
    line: myhostname = {{ base_setup__set_hostname }}
    regexp: '^myhostname\s*='
    state: present
  when:
    base_setup__set_hostname is ansible.builtin.truthy and
    base_setup__setup_postfix | bool
  notify: _tina_reload_postfix

- name: Set mailname
  ansible.builtin.copy:
    content: |
      {{ base_setup__set_hostname }}
    dest: /etc/mailname
    owner: root
    group: root
    mode: '0644'
  when:
    base_setup__set_hostname is ansible.builtin.truthy and
    base_setup__setup_postfix | bool
  notify: _tina_reload_postfix

- name: Install sudo
  ansible.builtin.package:
    name: sudo
    state: present
  when: base_setup__setup_sudo

- name: Set up sudoers for sudo group
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^%sudo\s'
    line: |-
      {{
        '%sudo ALL=(ALL) ALL'
        if base_setup__passwordless_sudo is ansible.builtin.truthy else
        '%sudo ALL=(ALL) NOPASSWD: ALL'
      }}
    validate: visudo -cf %s
  when: base_setup__setup_sudo | bool

- name: Bash defaults
  ansible.builtin.template:
    src: bash.bashrc.j2
    dest: /etc/bash.bashrc
    mode: '0644'

- name: Configure locales
  ansible.builtin.include_role:
    name: locales
  vars:
    locales__default_locale: '{{ base_setup__default_locale }}'
    locales__generate: '{{ base_setup__locales_to_be_generated }}'
  when: base_setup__setup_locales is ansible.builtin.truthy

- name: Configure sshd
  ansible.builtin.include_role:
    name: sshd
  vars:
    sshd__password_auth_allowed: '{{ base_setup__sshd_password_auth_allowed }}'
    sshd__root_login_allowed: '{{ base_setup__sshd_root_login_allowed }}'
