# vim:ts=2:sw=2:et:ai:sts=2
---
- name: Check cloud-init presence
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg
  register: _cloud_init_cfg
  when: base_setup__disable_cloud_init | bool
  check_mode: false

- name: Disable cloud-init
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: '0644'
  when: base_setup__disable_cloud_init | bool and _cloud_init_cfg.stat.exists

- name: Disable systemd-resolved (removing libnss-resolve)
  ansible.builtin.package:
    name: libnss-resolve
    state: absent
  when: base_setup__disable_resolved | bool

- name: Set hostname and FQDN
  ansible.builtin.include_role:
    name: hostname
  vars:
    hostname__fqdn: '{{ base_setup__set_hostname }}'
  when: base_setup__set_hostname is ansible.builtin.truthy

- name: Setup APT, upgrade installed packages, and install base packages
  ansible.builtin.include_role:
    name: apt
  vars:
    apt__run_upgrade: true
    apt__run_autoremove: true
    apt__purge_removed: true
    apt__packages_to_install: '{{ _base_setup__pkg_install }}'
    apt__services_to_enable: '{{ _base_setup__svc_enable_start }}'
    apt__services_to_start: '{{ _base_setup__svc_enable_start }}'

- name: Set mail relay
  ansible.builtin.lineinfile:
    dest: /etc/postfix/main.cf
    line: relayhost = {{ base_setup__mail_relay }}
    regexp: '^relayhost\s*='
    insertafter: '^\s*#relayhost'
    state: present
  when:
    base_setup__mail_relay is ansible.builtin.truthy and
    base_setup__setup_postfix | bool
  notify: _tina_reload_postfix

- name: Set hostname for postfix
  ansible.builtin.lineinfile:
    dest: /etc/postfix/main.cf
    line: myhostname = {{ base_setup__set_hostname }}
    regexp: '^myhostname\s*='
    state: present
  when:
    base_setup__set_hostname is ansible.builtin.truthy and
    base_setup__setup_postfix | bool
  notify: _tina_reload_postfix

- name: Set mailname
  ansible.builtin.copy:
    content: |
      {{ base_setup__set_hostname }}
    dest: /etc/mailname
    owner: root
    group: root
    mode: '0644'
  when:
    base_setup__set_hostname is ansible.builtin.truthy and
    base_setup__setup_postfix | bool
  notify: _tina_reload_postfix

- name: 'Set up sudoers: sudo group'
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^%sudo\s'
    line: '%sudo ALL=(ALL) ALL'
    validate: visudo -cf %s
  when: base_setup__setup_sudo | bool

- name: 'Set up sudoers: sudo-nopw group'
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^%sudo-nopw\s'
    line: '%sudo-nopw ALL=(ALL) NOPASSWD: ALL'
    validate: visudo -cf %s
  when: base_setup__setup_sudo | bool

- name: Set default locale
  ansible.builtin.debconf:
    name: locales
    question: locales/default_environment_locale
    value: '{{ base_setup__default_locale }}'
    vtype: select
  when: base_setup__setup_locales | bool
  notify: _tina_reconfigure_locales

- name: Set list of locales to be generated
  ansible.builtin.debconf:
    name: locales
    question: locales/locales_to_be_generated
    value: '{{ base_setup__locales_to_be_generated | join(", ") }}'
    vtype: multiselect
  when: base_setup__setup_locales | bool
  notify: _tina_reconfigure_locales

- name: Bash defaults
  ansible.builtin.template:
    src: bash.bashrc.j2
    dest: /etc/bash.bashrc
    mode: '0644'

- name: Configure sshd
  ansible.builtin.include_role:
    name: sshd
  vars:
    sshd__password_auth_allowed: '{{ base_setup__sshd_password_auth_allowed }}'
    sshd__root_login_allowed: '{{ base_setup__sshd_root_login_allowed }}'
