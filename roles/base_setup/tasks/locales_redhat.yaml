# vim:ts=2:sw=2:et:ai:sts=2
---
- name: Install glibc language packs
  ansible.builtin.package:
    name: '{{ _base_setup__locale_langpacks }}'
    state: present

- name: Set default locale
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: LANG={{ base_setup__default_locale }}
    owner: root
    group: root
    mode: '0644'
    create: true
