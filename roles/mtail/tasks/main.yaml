# vim:ts=2:sw=2:et:ai:sts=2
---
- name: Install mtail
  ansible.builtin.package:
    name: mtail
    state: present
  notify: _tina_restart_mtail

- name: Configure mtail
  ansible.builtin.template:
    src: default.j2
    dest: /etc/default/mtail
    owner: root
    group: root
    mode: '0644'
  notify: _tina_restart_mtail

- name: Install mtail programs
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: /etc/mtail/{{ item | basename }}
    owner: root
    group: root
    mode: '0644'
  notify: _tina_restart_mtail
  with_items: '{{ mtail__programs or [] }}'

- name: Install ferm configuration
  ansible.builtin.include_role:
    name: ferm_svc
  vars:
    ferm_svc__name: mtail
    ferm_svc__allow_protos: tcp
    ferm_svc__allow_from: '{{ mtail__ferm_allow_from }}'
    ferm_svc__allow_ports: '{{ mtail__listen_port }}'
  when: mtail__install_ferm_svc | bool

- name: Start and enable service
  ansible.builtin.service:
    name: mtail
    state: started
    enabled: true
