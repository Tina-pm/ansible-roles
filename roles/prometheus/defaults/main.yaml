# vim:ts=2:sw=2:et:ai:sts=2
---

prometheus__listen_port: 9090
prometheus__listen_addr:
prometheus__retention_time:
prometheus__retention_size:
prometheus__external_url:
prometheus__extra_args:

# If true, install ferm configuration file.
prometheus__install_ferm_svc: false
# Optionally limit access by a list of IP addresses/blocks.
prometheus__ferm_allow_from: ~

prometheus__rules: []
prometheus__alertmanagers: []

# Scrape configuration: federated prometheus.
prometheus__federated_prometheus: []
prometheus__federated_prometheus_config: {}
# Only import metrics that have a ':' in their name (derived from explicit
# rules), or the special up metric.
prometheus__federate_filter:
  - '{__name__=~".+:.+"}'
  - '{job="prometheus"}'
  - up

# Scrape configuration: prometheus metrics.
prometheus__monitored_prometheus: []
prometheus__monitored_prometheus_config: {}

# Scrape configuration: alertmanager metrics.
prometheus__monitored_alertmanagers: '{{ prometheus__alertmanagers }}'
prometheus__monitored_alertmanagers_config: {}

# Scrape configuration: node_exporter metrics.
prometheus__monitored_nodes: []
prometheus__monitored_nodes_config: {}

# Free-form scrape configurations.
prometheus__scrape_configs: []
