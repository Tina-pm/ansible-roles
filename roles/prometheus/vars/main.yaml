# vim:ts=2:sw=2:et:ai:sts=2
---

__federated_scrape_config:
  job_name: federate
  honor_labels: true
  metrics_path: /federate
  params:
    'match[]': '{{ prometheus__federate_filter }}'
  static_configs:
    - targets: '{{ (prometheus__federated_prometheus or []) | list }}'
__federated_scrape_config2: |-
  {{
    __federated_scrape_config |
    combine(prometheus__federated_prometheus_config or {})
  }}

__prom_scrape_config:
  job_name: prometheus
  scrape_interval: 5s
  scrape_timeout: 5s
  static_configs:
    - targets: '{{ (prometheus__monitored_prometheus or []) | list }}'
__prom_scrape_config2: |-
  {{
    __prom_scrape_config |
    combine(prometheus__monitored_prometheus_config or {})
  }}

__alertmanager_scrape_config:
  job_name: alertmanager
  static_configs:
    - targets: '{{ (prometheus__monitored_alermanagers or []) | list }}'
__alertmanager_scrape_config2: |-
  {{
    __alertmanager_scrape_config |
    combine(prometheus__monitored_alermanagers_config or {})
  }}

__node_scrape_config:
  job_name: node
  static_configs:
    - targets: '{{ (prometheus__monitored_nodes or []) | list }}'
__node_scrape_config2: |-
  {{
    __node_scrape_config |
    combine(prometheus__monitored_nodes_config or {})
  }}

__all_scrape_configs: |-
  {{
    ([__federated_scrape_config2] if prometheus__federated_prometheus else []) +
    ([__prom_scrape_config2] if prometheus__monitored_prometheus else []) +
    ([__alertmanager_scrape_config2] if prometheus__alertmanagers else []) +
    ([__node_scrape_config2] if prometheus__monitored_nodes else []) +
    (prometheus__scrape_configs or [])
  }}
