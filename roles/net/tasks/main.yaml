# vim:ts=2:sw=2:et:ai:sts=2
---

- name: Validate network backend configuration
  ansible.builtin.assert:
    that:
      - net__backend in ['auto', 'ifupdown', 'networkmanager']
      - net__backend != 'auto' or
        ansible_facts.os_family in _net__backend_by_os_family
    quiet: true
    fail_msg: >-
      Unsupported network backend configuration: net__backend is
      "{{ net__backend }}" and the OS family is
      "{{ ansible_facts.os_family }}". Supported backends are ifupdown and
      networkmanager; auto selects ifupdown on Debian and NetworkManager on
      RedHat-family systems.

- name: Check cloud-init presence
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg
  register: _cloud_init_cfg
  check_mode: false

- name: Disable cloud-init network configuration
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    mode: '0644'
    content: |
      network: {config: disabled}
  when: _cloud_init_cfg.stat.exists

- name: Find cloud-init generated netplan configuration files
  ansible.builtin.find:
    paths:
      - /etc/netplan
    patterns:
      - ??-cloud-init.yaml
  register: _netplan_cfg
  when:
    - _cloud_init_cfg.stat.exists
    - ansible_facts.os_family == 'Debian'

- name: Find netplan generated configuration files
  ansible.builtin.find:
    paths:
      - /run/systemd/network
      - /run/udev/rules.d
    patterns:
      - ??-netplan-*.link
      - ??-netplan-*.network
      - ??-netplan-*.rules
  register: _networkd_cfg
  when:
    - _cloud_init_cfg.stat.exists
    - ansible_facts.os_family == 'Debian'

- name: Remove generated configuration files
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: >-
    {{ ((_networkd_cfg.files if _networkd_cfg is defined else []) +
        (_netplan_cfg.files if _netplan_cfg is defined else [])) }}
  when:
    - _cloud_init_cfg.stat.exists
    - ansible_facts.os_family == 'Debian'

- name: Check NetworkManager connection directories
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - /etc/NetworkManager/system-connections
    - /run/NetworkManager/system-connections
  register: _nm_conn_dirs
  when:
    - _cloud_init_cfg.stat.exists
    - _net__backend == 'networkmanager'

- name: Find cloud-init generated NetworkManager connection profiles
  ansible.builtin.find:
    paths: '{{ _nm_existing_conn_dirs }}'
    patterns: cloud-init*
    file_type: any
  register: _nm_cloud_init_profiles
  vars:
    _nm_existing_conn_dirs: >-
      {{ (_nm_conn_dirs.results if _nm_conn_dirs is defined else []) |
         selectattr('stat.exists', 'defined') |
         selectattr('stat.exists') | map(attribute='stat.path') | list }}
  when:
    - _cloud_init_cfg.stat.exists
    - _net__backend == 'networkmanager'
    - _nm_existing_conn_dirs | length > 0

- name: Remove cloud-init generated NetworkManager connection profiles
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: >-
    {{ _nm_cloud_init_profiles.files
       if _nm_cloud_init_profiles is defined else [] }}
  when:
    - _cloud_init_cfg.stat.exists
    - _net__backend == 'networkmanager'

- name: Configure interfaces using ifupdown
  ansible.builtin.include_tasks: ifupdown.yaml
  when: _net__backend == 'ifupdown'

- name: Configure interfaces using NetworkManager
  ansible.builtin.include_tasks: networkmanager.yaml
  when: _net__backend == 'networkmanager'

- name: Apply configuration
  ansible.builtin.meta: flush_handlers
