# vim:ts=2:sw=2:et:ai:sts=2
---
argument_specs:
  main:
    short_description: Install and configure the SSH daemon (sshd)
    description:
      - This role installs and configures the SSH daemon (sshd).
      - Ensures host keys are present.
    author:
      - Martina Ferrari
    options:
      sshd__password_auth_allowed:
        description:
          Specifies whether password authentication is allowed (bool or None).
        type: raw
        default: false

      sshd__root_login_allowed:
        description: Specifies whether root can log in using ssh (bool or None).
        type: raw
        default: false

      sshd__package_name:
        description: Name of the package to install.
        type: str

      sshd__service_name:
        description: Name of the system service.
        type: str

      sshd__config_path:
        description: Path to the main configuration file.
        type: str

      sshd__configd_dir:
        description: Path to the configuration fragments directory.
        type: str

      sshd__config_mask:
        description:
          - File creation mask for configuration files and directories.
          - Unset bits in the mask are cleared from the created file mode.
            E.g. a mask of V<'0775'> will create files with mode C<'0664'> and
            directories with mode C<'0775'>.
        type: str
