# vim:ts=2:sw=2:et:ai:sts=2
---

_sshd_os_family_defaults:
  Debian:
    sshd__package_name: openssh-server
    sshd__service_name: sshd
    sshd__config_path: /etc/ssh/sshd_config
  RedHat:
    sshd__package_name: openssh-server
    sshd__service_name: sshd
    sshd__config_path: /etc/ssh/sshd_config

_sshd_package_name: |-
  {{
    sshd__package_name or (
      _sshd_os_family_defaults[ansible_facts.os_family].sshd__package_name |
      mandatory(
        'No default value for sshd__package_name in %s' %
        ansible_facts.os_family
      )
    )
  }}
_sshd_service_name: |-
  {{
    sshd__service_name or (
      _sshd_os_family_defaults[ansible_facts.os_family].sshd__service_name |
      mandatory(
        'No default value for sshd__service_name in %s' %
        ansible_facts.os_family
      )
    )
  }}
_sshd_config_path: |-
  {{
    sshd__config_path or (
      _sshd_os_family_defaults[ansible_facts.os_family].sshd__config_path |
      mandatory(
        'No default value for sshd__config_path in %s' %
        ansible_facts.os_family
      )
    )
  }}
