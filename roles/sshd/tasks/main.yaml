# vim:ts=2:sw=2:et:ai:sts=2
---

- name: Install server package
  ansible.builtin.package:
    name: '{{ sshd__package_name }}'
    state: present

- name: Configure password authentication
  ansible.builtin.lineinfile:
    dest: '{{ sshd__config_path }}'
    state: present
    regexp: '^PasswordAuthentication\s'
    insertafter: '^#\s*PasswordAuthentication\s'
    line: |-
      PasswordAuthentication {{
        'yes' if sshd__password_auth_allowed else 'no'
      }}
  when: sshd__password_auth_allowed not in (None, '')
  notify: _tina_reload_sshd

- name: Configure root login
  ansible.builtin.lineinfile:
    dest: '{{ sshd__config_path }}'
    state: present
    regexp: '^PermitRootLogin\s'
    insertafter: '^#\s*PermitRootLogin\s'
    line: |-
      PermitRootLogin {{
        'prohibit-password' if sshd__root_login_allowed else 'no'
      }}
  when: sshd__root_login_allowed not in (None, '')
  notify: _tina_reload_sshd

- name: Enable and start service
  ansible.builtin.service:
    name: '{{ sshd__service_name }}'
    state: started
    enabled: true
