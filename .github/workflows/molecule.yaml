---
name: molecule

# Workflow disabled due to errors:
# https://github.com/Tina-pm/ansible-roles/issues/80
on:
  push:
    branches:
      - never
#  pull_request:
#  push:
#    branches:
#      - main
#      - force_ci/molecule/**  # For development/debugging of the workflow.

permissions:
  contents: read
  pull-requests: write

jobs:
  molecule:
    name: Molecule tests
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          path: ${{ github.repository }}

      - name: Run molecule
        uses: gofrolist/molecule-action@v2
        with:
          molecule_options: --verbose
