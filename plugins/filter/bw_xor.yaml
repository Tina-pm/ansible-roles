# vim:ts=2:sw=2:et:ai:sts=2
---
DOCUMENTATION:
  name: bw_xor
  author: Martina Ferrari
  version_added: 2.1.0
  short_description: xor (bitwise operator C(^))
  description:
    - Returns the "bitwise xor" of the received values.
  options:
    _input:
      description: First value.
      type: int
      required: true
    _second_val:
      description: Second value.
      type: int
      required: true

EXAMPLES: |
  # Toggle execute bits in file mode
  # 0o644 ^ 0o111 == 0o755
  {{ 0o644 | tina_pm.common.bw_xor(0o111) }}
  # 0o755 ^ 0o111 == 0o644
  {{ 0o755 | tina_pm.common.bw_xor(0o111) }}

RETURN:
  _value:
    description: The result of C(a ^ b).
    type: int
