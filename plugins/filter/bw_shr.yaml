# vim:ts=2:sw=2:et:ai:sts=2
---
DOCUMENTATION:
  name: bw_shr
  author: Martina Ferrari
  version_added: 2.1.0
  short_description: shift right (bitwise operator C(>>))
  description:
    - Returns the "bitwise shift right" of the input value by shifting the
      specified number of bits to the right.
  options:
    _input:
      description: Input value.
      type: int
      required: true
    _second_val:
      description: Number of places to shift.
      type: int
      required: true

EXAMPLES: |
  # Shift number by three places, equivalent to floor division by 2**3.
  # 83 >> 3 == 10
  {{ 83 | tina_pm.common.bw_shr(3) }}

RETURN:
  _value:
    description: The result of C(a >> b).
    type: int
