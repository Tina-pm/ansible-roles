---
- name: Set Debian architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: deb_arch
  changed_when: false

- name: Pre-install Debian package
  ansible.builtin.apt:
    # yamllint disable-line rule:line-length
    deb: https://github.com/ASSEKURANSA/glauth/releases/download/debian%2F2.3.2-0_exp5/glauth-binary-dist_2.3.2-0.exp5_{{ deb_arch.stdout }}.deb
    state: present
    update_cache: false

- name: Install ldap-utils
  ansible.builtin.apt:
    name: ldap-utils
    state: present

- name: Run glauth role
  ansible.builtin.include_role:
    name: glauth
